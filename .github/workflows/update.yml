name: Update Pinterest RSS
on:
  workflow_dispatch:
  schedule:
    - cron: '27 * * * *'
concurrency:
  group: pinterest-rss-publish
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore previous published feed
        shell: bash
        run: |
          mkdir -p site
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages
            git show FETCH_HEAD:dramahusky.xml > site/dramahusky.xml
            echo "REQUIRE_PREVIOUS_FEED=1" >> "$GITHUB_ENV"
          fi
      - name: Generate feed (stable IDs and dates)
        run: python generate_feed.py
        env:
          PREVIOUS_FEED_FILE: site/dramahusky.xml
      - name: Publish only when changed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            old_hash=$(git show origin/gh-pages:dramahusky.xml | sha256sum | cut -d' ' -f1)
            new_hash=$(sha256sum site/dramahusky.xml | cut -d' ' -f1)
            if [ "$old_hash" = "$new_hash" ]; then
              echo "Feed unchanged; no publication"
              exit 0
            fi
          fi
          cd site
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add .
          git commit -m "Update Pinterest RSS only for product changes"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
